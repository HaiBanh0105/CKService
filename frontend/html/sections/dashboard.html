<div class="section-header">
  <h2>Thống kê máy tính</h2>
</div>
<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-info">
      <h3>Tổng Máy</h3>
      <p id="totalComputers">0</p>
    </div>
    <div class="stat-icon blue">
      <i class="fas fa-desktop"></i>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-info">
      <h3>Máy Đang Hoạt Động</h3>
      <p id="activeComputers">0</p>
    </div>
    <div class="stat-icon green">
      <i class="fas fa-check-circle"></i>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-info">
      <h3>Máy Đang Bảo Trì</h3>
      <p id="maintenanceComputers">0</p>
    </div>
    <div class="stat-icon orange">
      <i class="fas fa-tools"></i>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-info">
      <h3>Tổng Máy Bị Khóa</h3>
      <p id="lockedComputers">0</p>
    </div>
    <div class="stat-icon orange">
      <i class="fas fa-lock"></i>
    </div>
  </div>
</div>

<div class="section-header">
  <h2>Báo Cáo Doanh Thu</h2>
</div>
<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-info">
      <h3>Doanh Thu Hôm Nay</h3>
      <p id="today"></p>
    </div>
    <div class="stat-icon green">
      <i class="fas fa-calendar-day"></i>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-info">
      <h3>Doanh Thu Tuần Này</h3>
      <p id="week"></p>
    </div>
    <div class="stat-icon blue">
      <i class="fas fa-calendar-week"></i>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-info">
      <h3>Doanh Thu Tháng Này</h3>
      <p id="month"></p>
    </div>
    <div class="stat-icon purple">
      <i class="fas fa-calendar-alt"></i>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-info">
      <h3>Tổng Doanh Thu</h3>
      <p id="total"></p>
    </div>
    <div class="stat-icon orange">
      <i class="fas fa-chart-line"></i>
    </div>
  </div>
</div>
