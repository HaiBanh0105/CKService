<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="login-container">
      <h2 style="color: red; font-size: 16px; text-align: left; margin: 0; font-weight: normal;"
      onclick="cancel()">Hủy</h2>
      <div class="logo">
        <h1>Quên mật khẩu</h1>
      </div>

      <div class="error-message" id="errorMessage" style="display: none"></div>
      <div
        class="success-message"
        id="successMessage"
        style="display: none"
      ></div>

        <div class="form-group">
          <label for="email">Email đăng ký</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Nhập Email của bạn"
            required
          />
        </div>

        <div class="form-group" style="position: relative">
          <label for="password">Mật khẩu mới</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Nhập mật khẩu"
            required
          />
          <span class="password-toggle" id="passwordToggle">👁️</span>
        </div>

        <div class="form-group" style="position: relative">
          <label for="password">Xác nhận mật khẩu</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Nhập lại mật khẩu mới"
            required
          />
          <span class="password-toggle" id="passwordToggle2">👁️</span>
        </div>

        <button type="submit" class="login-btn" id="submit">
          <span id="submit">Xác nhận</span>
        </button>

        <button type="confirm-otp" class="login-btn" id="confirm-otp" style="display: none;">
          <span id="confirmBtnText">Nhập otp</span>
        </button>
      </form>
    </div>
    <div id="forgot_password" class="modal"></div>
    <script src="../js/otpManager.js"></script>
    <script src="../js/forgot_password.js"></script>
  </body>
</html>
