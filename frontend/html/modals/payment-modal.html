<div class="modal-content">
  <div class="modal-header">
    <h3>Thanh Toán Phiên Sử Dụng</h3>
    <span class="close-modal" onclick="closeModal('paymentModal')"
      >&times;</span
    >
  </div>

  <div class="form-group">
    <label for="paymentUserName">Người Dùng</label>
    <input type="text" id="paymentUserName" readonly />
  </div>

  <div class="form-group">
    <label for="paymentComputerName">Tên Máy</label>
    <input type="text" id="paymentComputerName" readonly />
  </div>

  <div class="form-group">
    <label for="paymentTime">Thời gian sử dụng</label>
    <input type="text" id="paymentTime" readonly />
  </div>

  <div class="form-group">
    <label for="paymentAmount">Số Tiền (tối thiểu 1 giờ nếu đặt trước)</label>
    <input type="text" id="paymentAmount" readonly />
  </div>

  <div class="form-group">
    <label>Phương thức thanh toán</label>
    <div class="payment-methods">
      <div
        class="payment-method"
        data-method="account"
        onclick="selectPaymentMethod('account')"
      >
        👤 Account
      </div>
      <div
        class="payment-method"
        data-method="cash"
        onclick="selectPaymentMethod('cash')"
      >
        💵 Tiền mặt
      </div>
      <div
        class="payment-method"
        data-method="card"
        onclick="selectPaymentMethod('card')"
      >
        💳 Thẻ ngân hàng
      </div>
      <div
        class="payment-method"
        data-method="momo"
        onclick="selectPaymentMethod('momo')"
      >
        📱 MoMo
      </div>
    </div>
  </div>

  <div id="messageBox"></div>

  <div class="modal-actions">
    <button class="btn btn-primary" id="btnSubPayment">Xác nhận</button>
    <button class="btn btn-primary" id="btnConfirm-otp" style="display: none">
      Nhập otp
    </button>
  </div>
</div>
